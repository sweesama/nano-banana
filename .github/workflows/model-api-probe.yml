name: Model API Probe (No Publish)

on:
  push:
    branches:
      - codex/model-api-probe-20260828
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanobanana-model-api-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Probe MiniMax M3 and DeepSeek V4 Flash
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node .github/scripts/model-api-probe.mjs

