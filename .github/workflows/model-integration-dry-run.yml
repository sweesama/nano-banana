name: Blog Model Integration Dry Run

on:
  push:
    branches:
      - codex/model-api-probe-20260828

permissions:
  contents: read

concurrency:
  group: nano-banana-model-integration-dry-run
  cancel-in-progress: true

jobs:
  generate-audit-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate current site
        run: node scripts/validate-site.js

      - name: Install and test generator
        working-directory: web/blog/scripts
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Generate and source-audit one unpublished article
        working-directory: web/blog/scripts
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node generate-article.js

      - name: Validate generated site
        run: node scripts/validate-site.js

      - name: Confirm no publication
        run: echo "Full model integration passed; generated changes remain only on this disposable runner."
