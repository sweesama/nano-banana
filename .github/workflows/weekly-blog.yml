name: Generate Nano Banana Blog Article

on:
  schedule:
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install generator dependencies
        working-directory: web/blog/scripts
        run: npm install --no-audit --no-fund

      - name: Generate and publish article
        working-directory: web/blog/scripts
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BLOG_MODEL_PRIMARY: deepseek-ai/deepseek-v4-pro
          BLOG_MODEL_FALLBACK: qwen/qwen3.5-122b-a10b
          BLOG_MODEL_LAST_RESORT: nvidia/nemotron-3-super-120b-a12b
        run: node generate-article.js

      - name: Commit and push
        run: |
          git config user.name "Nano Banana Blog Bot"
          git config user.email "bot@nano-banana.live"
          git add web/blog web/sitemap.xml
          if git diff --staged --quiet; then
            echo "No article changes detected."
          else
            git commit -m "content: publish scheduled AI image article"
            git push
          fi
