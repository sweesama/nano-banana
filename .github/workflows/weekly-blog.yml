name: Publish Source-Audited Nano Banana Article

on:
  schedule:
    - cron: '17 0 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate, source-audit, and validate without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nano-banana-content-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate the current site
        run: node scripts/validate-site.js

      - name: Install generator dependencies
        working-directory: web/blog/scripts
        run: npm ci --no-audit --no-fund

      - name: Test publishing guards
        working-directory: web/blog/scripts
        run: npm test

      - name: Generate and source-audit one article
        id: generate
        continue-on-error: true
        working-directory: web/blog/scripts
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BLOG_DIAGNOSTICS_DIR: ${{ runner.temp }}/nano-banana-blog-diagnostics
        run: node generate-article.js

      - name: Save drafts and generation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blog-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nano-banana-blog-diagnostics
          retention-days: 14
          if-no-files-found: ignore

      - name: Validate the generated site
        run: node scripts/validate-site.js

      - name: Commit, rebase, revalidate, and publish
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        shell: bash
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          set -euo pipefail
          git config user.name "Nano Banana Blog Bot"
          git config user.email "bot@nano-banana.live"
          git add web/blog.html web/blog web/sitemap.xml
          if git diff --staged --quiet; then
            echo "No article changes detected."
            exit 0
          fi
          if [[ "$GENERATION_OUTCOME" == "success" ]]; then
            git commit -m "content: publish source-audited AI image article"
          else
            git commit -m "chore: defer failed blog topics"
          fi
          git pull --rebase origin main
          node scripts/validate-site.js
          git push origin HEAD:main

      - name: Confirm dry-run validation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true && steps.generate.outcome == 'success'
        run: echo "Dry run passed generation, source audit, and site validation; nothing was published."

      - name: Report generation failure
        if: always() && steps.generate.outcome == 'failure'
        run: |
          echo "::error::Generation failed. See the generation log and saved draft diagnostics."
          exit 1
